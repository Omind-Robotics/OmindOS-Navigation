# Include only in the existing cloud.omindos.cn HTTPS server.
# The separate loopback candidate requires existing operator authentication.
location ^~ /_navigation-preview/ {
    proxy_pass http://127.0.0.1:18889/;
    proxy_set_header Host 127.0.0.1:18889;
    proxy_set_header X-OmindOS-Public-Origin "";
    proxy_set_header X-OmindOS-Navigation-Preview "1";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_read_timeout 45s;
    proxy_connect_timeout 3s;
    client_max_body_size 2m;
    proxy_buffering off;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/javascript application/javascript text/css;
}
