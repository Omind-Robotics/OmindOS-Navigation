name: Transfer verified compiled Ubuntu update
on:
  push:
    branches: [codex/ubuntu-reference-installer-20261009]
    paths: ['.github/workflows/export-compiled-update-text.yml']
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Encode authenticated compiled payload for connector transfer
        run: |
          python - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          root=Path('release/compiled-update')
          summary=json.loads((root/'UPDATE_SUMMARY.json').read_text())
          assert summary['status']=='PASS'
          blob=(root/summary['filename']).read_bytes()
          assert len(blob)==summary['bytes'] and hashlib.sha256(blob).hexdigest()==summary['sha256']
          (root/'payload.base64.txt').write_bytes(base64.b64encode(blob))
          print('Encoded verified compiled payload; backend source absent')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/compiled-update/payload.base64.txt
          git commit -m 'build: encode verified compiled update for transfer'
          git push origin HEAD:${{ github.ref_name }}
