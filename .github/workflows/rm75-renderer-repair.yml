name: Repair and verify RM75 renderer
on:
  push:
    branches: [codex/rm75-cad-workbench-20261010]
    paths:
      - '.github/workflows/rm75-renderer-repair.yml'
      - 'tools/repair_rm75_renderer.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rm75-renderer-repair
  cancel-in-progress: false
jobs:
  repair:
    if: github.ref == 'refs/heads/codex/rm75-cad-workbench-20261010'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PYTHONPATH: scripts
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test and existing frontend build dependencies
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 trimesh==4.11.1 playwright==1.55.0
          npm ci --prefix web/robot-workbench
          python -m playwright install --with-deps chromium > /tmp/chromium-install.log 2>&1 || { tail -n 80 /tmp/chromium-install.log; exit 1; }
      - name: Repair exact existing renderer and rebuild its local bundle
        run: |
          python tools/repair_rm75_renderer.py
          node web/robot-workbench/build-renderer.cjs
          node --check web/robot-workbench/robot-scene.js
          git diff --check
      - name: Verify source and collision/API regressions
        shell: bash
        run: |
          python -m unittest discover -s tests -p 'test_robot*.py' -v > /tmp/robot-tests.log 2>&1 || { cat /tmp/robot-tests.log; exit 1; }
          tail -n 5 /tmp/robot-tests.log
          python -m unittest discover -s tests -p 'test_workbench*.py' -v > /tmp/workbench-tests.log 2>&1 || { cat /tmp/workbench-tests.log; exit 1; }
          tail -n 5 /tmp/workbench-tests.log
      - name: Verify actual workbench interactions without weakening CSP
        shell: bash
        run: python scripts/check_rm75_browser.py --output build/rm75-browser || { cat build/rm75-browser/server.log; exit 1; }
      - name: Commit renderer only after all gates pass
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/robot-workbench/robot-scene.source.js web/robot-workbench/robot-scene.js
          git commit -m 'fix: render verified RM75 CAD meshes and actual tool-frame trails'
          git push origin HEAD:refs/heads/codex/rm75-cad-workbench-20261010
          git rev-parse HEAD
      - name: Preserve browser gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rm75-renderer-browser-evidence
          path: build/rm75-browser/
          if-no-files-found: warn
          retention-days: 14
