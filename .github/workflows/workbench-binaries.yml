name: Build desktop workbench binaries
on:
  push:
    branches: [codex/workbench-binary-release]
    paths:
      - '.github/workflows/workbench-binaries.yml'
      - 'release/workbench/**'
      - 'scripts/workbench_desktop.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workbench-binary-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
          - os: windows-2022
            target: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Linux build dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y patchelf
      - name: Install compiler and frontend packer
        shell: bash
        run: |
          python -m pip install Nuitka==4.2.2 ordered-set==4.1.0 zstandard==0.25.0
          npm ci --prefix web/robot-workbench
      - name: Verify source on target platform
        run: python -m unittest discover -s tests -v
      - name: Build and test executable archive
        run: python release/workbench/package_binary.py --output build/workbench-release
      - name: Preserve validated binary package only
        uses: actions/upload-artifact@v4
        with:
          name: workbench-${{ matrix.target }}
          path: |
            build/workbench-release/omindos-workbench-*.zip
            build/workbench-release/omindos-workbench-*.tar.gz
            build/workbench-release/*.sha256
          if-no-files-found: error
          retention-days: 14
