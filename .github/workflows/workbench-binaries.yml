name: Build desktop workbench binaries
on:
  push:
    branches: [main, codex/workbench-binary-release, codex/manipulation-unified-preview6, codex/manipulation-unified-planning, codex/manipulation-navigation]
    paths:
      - '.github/workflows/workbench-binaries.yml'
      - 'release/workbench/**'
      - 'scripts/workbench_desktop.py'
      - 'scripts/robot_connections.py'
      - 'scripts/robot_parameter_api.py'
      - 'scripts/robot_workbench.py'
      - 'scripts/robot_assets.py'
      - 'scripts/robot_sequence.py'
      - 'scripts/robot_planning.py'
      - 'scripts/dual_task_planner.py'
      - 'scripts/robot_navigation.py'
      - 'scripts/navigation_*.py'
      - 'scripts/robot_kinematics.py'
      - 'scripts/workbench_state.py'
      - 'config/robot_models/realman_rm75/**'
      - 'config/robot_profiles/workbench-demo.json'
      - 'scripts/robot_runtime_client.py'
      - 'scripts/robot_profile_runtime*.py'
      - 'tests/test_robot*.py'
      - 'web/robot-workbench/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workbench-binary-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Linux build dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y patchelf
      - name: Install compiler and frontend packer
        shell: bash
        run: |
          python -m pip install Nuitka==4.2.2 ordered-set==4.1.0 zstandard==0.25.0 numpy==1.26.4 scipy==1.14.1
          npm ci --prefix web/robot-workbench
      - name: Verify source on target platform
        run: python -m unittest discover -s tests -p 'test_robot*.py' -v
      - name: Build and test executable archive
        run: python release/workbench/package_binary.py --output build/workbench-release
      - name: Preserve validated binary package only
        uses: actions/upload-artifact@v4
        with:
          name: workbench-${{ matrix.target }}
          path: |
            build/workbench-release/omindos-workbench-*.zip
            build/workbench-release/omindos-workbench-*.tar.gz
            build/workbench-release/*.sha256
            build/workbench-release/planning-*-validation.json
            build/workbench-release/navigation-*-validation.json
          if-no-files-found: error
          retention-days: 7



