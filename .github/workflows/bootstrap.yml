name: Bootstrap OmindOS Navigation v0.1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Import navigation source
        run: |
          git clone --depth 1 https://github.com/fushenger/nav_3d2.git /tmp/nav3d
          rsync -a --delete --exclude='.git' --exclude='.github/workflows/bootstrap.yml' /tmp/nav3d/ ./
          mkdir -p .github/workflows docs
          cat > README.md <<'EOF'
# OmindOS Navigation

**OmindOS Navigation v0.1** is the ROS 2 Humble navigation stack maintained for the OmindOS robotics platform.

## v0.1 scope

The v0.1 baseline preserves the complete reusable navigation chain:

- Livox / LiDAR sensor integration
- FAST-LIO ROS 2 localization and mapping
- 3D PRM planning and EDT-based environment representation
- Bézier path optimization
- NMPC local planning and control, with the existing fallback tracker
- RViz2 3D navigation goal tools
- ROS 2 native validation stack

## Platform boundary

The navigation core is platform-independent. Robot-specific bridges belong in platform adapters.

The existing Go2-specific files under `nav3d_hardware_bringup` and legacy `3D_NAV` are retained for compatibility and reference, but they are **not part of the OmindOS generic navigation core** and are not the default platform target.

OmindOS integrations should expose standard ROS 2 interfaces for localization, goals, paths, odometry and motion commands, with robot-specific conversion isolated in adapters.

## Main ROS 2 packages

- `nav3d_native` — deterministic ROS 2 baseline and validation
- `FAST_LIO_ROS2` — LiDAR-inertial odometry
- `livox_ros_driver2` — Livox sensor interface
- `planning_3d_ros2` — 3D PRM planning and Bézier optimization
- `nmpc_planner_ros2` — local planning and control
- `rviz_3d_nav_goal_tool_ros2` — RViz2 3D goal tools
- `nav3d_hardware_bringup` — legacy/platform integration layer

See `docs/OMINDOS_V0_1.md` for the v0.1 boundary.
EOF
          cat > docs/OMINDOS_V0_1.md <<'EOF'
# OmindOS Navigation v0.1

## Purpose

This release freezes the current ROS 2 Humble Nav_3d-derived stack as the first OmindOS Navigation baseline.

## Preserved capabilities

v0.1 intentionally retains FAST-LIO, Livox integration, 3D planning, Bézier optimization, NMPC, RViz2 3D goal tooling, and the native ROS 2 validation path.

## Platform separation

Go2-specific controllers, odometry bridges, command gates, safety supervision, launch files, and extrinsics are treated as legacy/platform adapter material. They are retained to avoid damaging validated hardware and localization paths, but OmindOS Navigation core must not depend on Go2.

Future robot support should be implemented through platform adapters behind stable ROS 2 interfaces.

## Validation boundary

The inherited 2026-09-08 codebase includes offline ROS 2 validation and hardware-bringup tests. The historical validation showed the 3D offline loop reaching COMPLETED, while the CasADi QRSQP NMPC solver could fall back to the existing tracker in some cycles. Go2 real-motion validation was not claimed by that record.

## Next v0.1 work

1. Formalize OmindOS ROS 2 interface contracts.
2. Move robot-specific integrations into explicit adapters.
3. Add multi-goal inspection mission management.
4. Add whole-robot collision checking.
5. Run acceptance tests on the intended OmindOS hardware platform.
EOF
          git config user.name "OmindOS Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Import OmindOS Navigation v0.1" || exit 0
          git push
