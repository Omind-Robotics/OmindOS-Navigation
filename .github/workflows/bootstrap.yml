name: Bootstrap OmindOS Navigation v0.1
on:
  workflow_dispatch:
    inputs:
      confirm_source_reimport:
        description: 'Overwrite the current source tree from upstream (initial import only)'
        type: boolean
        required: true
        default: false
permissions:
  contents: write
jobs:
  bootstrap:
    if: ${{ inputs.confirm_source_reimport }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Import navigation source
        shell: bash
        run: |
          git clone --depth 1 https://github.com/fushenger/nav_3d2.git /tmp/nav3d
          rm -rf /tmp/nav3d/.git /tmp/nav3d/.github
          rsync -a --delete --exclude='.git' --exclude='.github' /tmp/nav3d/ ./
          mkdir -p .github/workflows docs
          echo '' | base64 -d > README.md
          echo '' | base64 -d > docs/OMINDOS_V0_1.md
          git config user.name "OmindOS Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Import OmindOS Navigation v0.1" || exit 0
          git push
