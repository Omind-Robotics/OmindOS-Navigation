name: Ubuntu quadruped reference UI
on:
  push:
    branches: [codex/quadruped-reference-view-20261009]
    paths:
      - '.github/workflows/quadruped-reference-preview.yml'
      - 'scripts/**'
      - 'release/workbench/**'
      - 'web/robot-workbench/**'
      - 'config/robot_models/mevius2/UPSTREAM.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install fixed preview dependencies
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1
          npm ci --prefix web/robot-workbench
          mkdir -p build/capture
          npm install --prefix build/capture --no-save playwright@1.58.0
          test -x /usr/bin/google-chrome
          echo 'CHROMIUM_EXECUTABLE=/usr/bin/google-chrome' >> "$GITHUB_ENV"
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify common backend and fixed reference assets
        run: |
          python scripts/fetch_mevius2_workbench.py
          python -m unittest discover -s tests -p 'test_robot*.py' -v
          python -m unittest discover -s tests -p 'test_quadruped_reference*.py' -v
          node web/robot-workbench/build-renderer.cjs
      - name: Prepare isolated quadruped preview
        run: |
          mkdir -p build/quadruped-preview/web
          cp -a scripts build/quadruped-preview/scripts
          cp -a web/robot-workbench build/quadruped-preview/web/robot-workbench
          PYTHONPATH=release/workbench python - <<'PY'
          from pathlib import Path
          from quadruped_variant import prepare
          prepare(Path('build/quadruped-preview'), Path('.').resolve())
          PY
          python release/workbench/smoke_binary.py build/quadruped-preview/scripts/workbench_desktop.py --variant quadruped --source --report build/source-smoke.json
          python build/quadruped-preview/scripts/robot_workbench.py --store build/clean-preview-store --port 8085 >build/workbench.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8085/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8085/ >/dev/null
      - name: Capture and verify actual interface
        env:
          NODE_PATH: ${{ github.workspace }}/build/capture/node_modules
        run: node scripts/capture_quadruped_reference.cjs docs/media/quadruped-reference
      - name: Preserve preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-quadruped-reference-ui
          path: docs/media/quadruped-reference/
          if-no-files-found: error
      - name: Save screenshots to the private review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/media/quadruped-reference/ web/robot-workbench/robot-scene.js
          git commit -m 'docs: capture complete quadruped reference workbench' || test -z "$(git status --porcelain docs/media/quadruped-reference/)"
          git push origin HEAD:${{ github.ref_name }}
