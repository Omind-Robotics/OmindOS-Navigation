# Map Process Parameters Configuration
# 可通行区域提取参数配置文件

# ============================================================
# 轨迹文件格式选择 (Trajectory file format selection)
# ============================================================
# 轨迹文件格式类型 (1, 2, 或 3)
# Format 1: timestamp x y z qx qy qz qw (原始格式，带时间戳和四元数)
# Format 2: x y z param1 param2 param3 (新格式，位置在第1-3列)
# Format 3: multiple_values x y z more_values (多列格式，位置在第5-7列)
trajectory_format: 1

# ============================================================
# 输出选项 (Output options)
# ============================================================
save_individual_regions: false  # 是否将每个识别出的区域保存为单独的文件（用于调试和可视化）

# ============================================================
# 轨迹采样参数 (Trajectory sampling parameters)
# ============================================================
# 轨迹采样间隔距离（米）
# 从原始轨迹中每隔此距离采样一个位姿点用于生成种子点
# 值越小：种子点越密集，覆盖越完整，但计算量更大
# 值越大：种子点稀疏，计算快速，但可能遗漏区域
trajectory_sample_interval: 0.95

# ============================================================
# 种子点选择参数 (Seed point selection parameters)
# ============================================================
# 在采样的轨迹点周围搜索地面点的半径范围（米）
# 值越大：搜索范围更广，更容易找到种子点
# 值越小：搜索更精确，但可能找不到合适的种子点
seed_search_radius: 0.5

# 从机器人位姿向下偏移的高度，用于在地面位置搜索种子点（米）
# 例如：机器人中心高度1.3米，减去此值得到地面高度
# 需根据实际机器人高度调整
seed_height_offset: 0.4

# ============================================================
# 区域生长参数 (Region growing parameters)
# 这些参数控制PCL区域生长算法的行为，决定相邻点是否可以合并到同一区域
# ============================================================

# 相邻两点法向量之间的最大允许夹角（度）
# 值越小：表面需要更平坦才能合并
# 值越大：允许更大的表面起伏
normal_angle_threshold: 30.0

# 相邻两点曲率的最大允许差异（无量纲）
# 值越小：要求表面曲率更一致
# 值越大：允许更大的曲率变化
curvature_threshold: 0.15

# 相邻两点Z轴高度的最大允许差异（米）
# 【关键参数！】控制XY方向扩展能力
# 值越小：区域生长越受限，XY扩展不足
# 值越大：允许沿着高度方向更大的变化，XY扩展更好
height_threshold: 0.1

# 寻找邻近点的搜索半径（米）
# 值越大：搜索范围更广，区域可能连接得更好
# 值越小：只考虑非常近的点
search_radius: 0.1

# 一个有效区域的最小点数
# 小于此值的区域会被丢弃（去除噪声）
min_cluster_size: 10

# 一个区域的最大点数
# 达到此值后停止生长（防止无限制扩展）
max_cluster_size: 1000000

# 计算点云法向量时的搜索半径（米）
# 值越大：法向量计算更平滑但耗时
# 值越小：法向量对局部特征更敏感
normal_search_radius: 0.3

# ============================================================
# 后处理参数 (Post-processing parameters)
# ============================================================

# 合并相邻区域的距离阈值（米）
# 距离小于此值的区域会被合并为一个
merge_distance_threshold: 0.1

# 最终保留区域的最小点数
# 小于此值的区域会被过滤掉
min_region_size: 1

# 是否使用统计方法移除离群点（噪声点）
remove_outliers: true

# ============================================================
# 地面表面约束参数 (Ground surface constraints)
# 这些参数在区域生长之前对点云进行预过滤，只保留地面点
# ============================================================

# 地面点法向量与垂直方向的最大允许夹角（度）
# 值越小：只接受接近水平的表面
# 值越大：允许一定倾斜的表面
max_ground_normal_angle: 45.0

# 【重要开关】高度过滤开关
# true: 启用高度过滤（使用XY平面搜索+高度检查，适合多层/楼梯环境）
# false: 禁用高度过滤（仅检查法向量，区域在XY方向更自由扩展，适合单层环境）
enable_height_filter: false

# 地面点与最近种子点的最大允许高度差（米）
# 仅当 enable_height_filter=true 时生效
# 值越大：允许更大的高度差异
seed_height_diff_threshold: 0.1

# 在XY平面搜索高度兼容种子点的半径（米）
# 仅当 enable_height_filter=true 时生效
# 值越大：搜索范围更广，更容易找到合适的种子点
seed_xy_search_radius: 10.0

# ============================================================
# 点云降采样参数 (Point cloud downsampling)
# 用于处理大规模点云，提高计算效率
# ============================================================

# 是否启用体素网格降采样
# true: 对大点云自动降采样（提高速度）
# false: 使用原始点云（更精确但更慢）
enable_voxel_downsampling: true

# 体素网格的大小/边长（米）
# 值越大：降采样越激进，点云越稀疏，速度越快
# 值越小：保留更多细节，精度越高
voxel_size: 0.10

# 触发降采样的点数阈值
# 只有当点云点数超过此值时才进行降采样
downsampling_threshold: 1000000

# ============================================================
# 参数调优建议 (Tuning Guidelines)
# ============================================================
#
# 【如果XY方向扩展不足】:
#   1. 增大 height_threshold (例如: 0.01 -> 0.1) - 最关键！
#   2. 设置 enable_height_filter: false - 完全禁用高度约束
#   3. 增大 search_radius (例如: 0.3 -> 0.5)
#   4. 增大 normal_angle_threshold (例如: 30 -> 45)
#   5. 减小 trajectory_sample_interval (例如: 1.0 -> 0.1)
#
# 【如果提取结果包含太多噪声】:
#   1. 减小 height_threshold
#   2. 减小 normal_angle_threshold
#   3. 增大 min_cluster_size
#   4. 设置 remove_outliers: true
#
# 【如果处理速度太慢】:
#   1. 启用 enable_voxel_downsampling: true
#   2. 增大 voxel_size
#   3. 增大 trajectory_sample_interval
#   4. 减小 normal_search_radius
#
