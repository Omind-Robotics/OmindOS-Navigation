common:
    lid_topic:  "/rslidar_points"
    imu_topic:  "/rslidar_imu_data"
    time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
    time_offset_lidar_to_imu: -0.119118 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
                                  # This param will take effect no matter what time_sync_en is. So if the time offset is not known exactly, please set as 0.0
    # y轴旋转90度
    imu2lidarMatrix: [
        0.00353417, -0.00880108, -0.999955,   -0.00443803,
       -0.999992,   -0.00209707, -0.00351585,  0.00424305,
       -0.00206604,  0.999959,   -0.00880842, -0.00421033,
        0,           0,           0,           1
    ]
    # y轴旋转-90度，z轴旋转180度
    # imu2lidarMatrix: [
    #     0.00832954, -0.00213708, -0.999963, -0.0044863, 
    #     0.999946,   -0.00621018, 0.00834267, -0.0041866, 
    #     -0.00622765, -0.999978, 0.00208524, 0.00421568,
    #               0,         0,          0,          1,
    # ]

preprocess:
    lidar_type: 5                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR, 4 for pandar Lidar, 5 for rs LiDAR
    scan_line: 196
    scan_rate: 10                # only need to be set for velodyne, unit: Hz,
    timestamp_unit: 2            # the unit of time/t field in the PointCloud2 rostopic: 0-second, 1-milisecond, 2-microsecond, 3-nanosecond.
    blind: 0.1

mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree:    180
    det_range:     100.0
    extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic,
    extriinsic_T: [ 0.0, 0.0, 0.0 ]
    extrinsic_R: [0.0, 0.0, 1.0,
                  0.0, 1.0, 0.0,
                 -1.0, 0.0, 0.0]

publish:
    path_en:  false
    scan_publish_en:  true       # false: close all the point cloud output
    dense_publish_en: false       # false: low down the points number in a global-frame point clouds scan.
    scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame

pcd_save:
    pcd_save_en: false
    interval: -1                 # how many LiDAR frames saved in each pcd file; 
                                 # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.